<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NaruCannon">
<link rel="manifest" href="manifest.webmanifest">
<title>NaruCannon Tracker</title>
<style>
:root{--bg:#0b0d12;--card:#151923;--card2:#1b2030;--text:#f5f7fb;--muted:#9ca5b5;--accent:#ff4d4d;--line:#293042}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#090b10,#111522);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:auto;padding:28px 16px 60px}.hero{padding:24px;border:1px solid var(--line);border-radius:22px;background:rgba(21,25,35,.94);box-shadow:0 15px 45px #0006}
h1{margin:0;font-size:36px}.sub{color:var(--muted);margin-top:5px}.desc{color:#d5dae4;line-height:1.55;margin-top:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stat{background:var(--card2);padding:13px;border-radius:14px;border:1px solid var(--line)}.stat b{font-size:22px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.bar{height:10px;background:#252b3a;border-radius:99px;overflow:hidden;margin-top:16px}.fill{height:100%;background:var(--accent);width:0;transition:.25s}
.controls{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select,button{font:inherit}input,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px}input{flex:1;min-width:220px}button{background:var(--card2);color:var(--text);border:1px solid var(--line);padding:11px 14px;border-radius:12px;cursor:pointer}
.season{margin-top:22px}.season-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}h2{margin:0;font-size:22px}
.season-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.season-count{color:var(--muted);font-size:13px}
.selectall{padding:7px 10px;font-size:12px}.episode{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:13px 14px;margin:7px 0;background:var(--card);border:1px solid var(--line);border-radius:15px}
.episode.done{opacity:.62}.episode.done .title{text-decoration:line-through}.num{color:var(--muted);font-weight:700}.title{font-weight:650}.meta{color:var(--muted);font-size:12px;margin-top:4px}
.check{width:28px;height:28px;border-radius:8px;padding:0;background:#11151e;color:#fff}.done .check{background:var(--accent);border-color:var(--accent)}
.small{font-size:12px;color:var(--muted);margin-top:18px}@media(max-width:650px){h1{font-size:29px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.season-head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<section class="hero"><h1>🔥 NaruCannon</h1><div class="sub">Naruto — Recut · Custom Tracker</div>
<div class="desc">Your own NaruCannon episode order, completely separate from Trakt and Showly.</div>
<div class="stats"><div class="stat"><b id="watched">0</b><span>episodes watched</span></div><div class="stat"><b>51</b><span>total episodes</span></div><div class="stat"><b id="percent">0%</b><span>complete</span></div></div>
<div class="bar"><div class="fill" id="fill"></div></div></section>
<div class="controls"><input id="search" placeholder="Search episodes…"><select id="season"><option value="all">All seasons</option><option value="1">Season 1</option><option value="2">Season 2</option></select><button id="reset">Reset progress</button></div>
<main id="list"></main><div class="small">Progress is saved automatically in this browser. Each season has its own Select All / Deselect All control.</div>
</div><script>
const DATA={"seasons": [{"number": 1, "title": "The Beginning", "episodes": [{"number": 1, "title": "The Beginning", "original": "TBC", "date": "TBC"}, {"number": 2, "title": "Konohamaru", "original": "TBC", "date": "TBC"}, {"number": 3, "title": "Start of Team 7", "original": "TBC", "date": "TBC"}, {"number": 4, "title": "Bell Test", "original": "TBC", "date": "TBC"}, {"number": 5, "title": "Team 7 First Mission", "original": "TBC", "date": "TBC"}, {"number": 6, "title": "Zabuza Introduction", "original": "TBC", "date": "TBC"}, {"number": 7, "title": "Team 7 Fight Zabuza", "original": "TBC", "date": "TBC"}, {"number": 8, "title": "Tree Climbing", "original": "TBC", "date": "TBC"}, {"number": 9, "title": "Haku Introduction", "original": "TBC", "date": "TBC"}, {"number": 10, "title": "Haku Ice Mirrors", "original": "TBC", "date": "TBC"}, {"number": 11, "title": "Naruto Reveals Kyuubi", "original": "TBC", "date": "TBC"}, {"number": 12, "title": "Haku Dies", "original": "TBC", "date": "TBC"}, {"number": 13, "title": "Zabuza Dies / Bridge Built / End of Arc", "original": "TBC", "date": "TBC"}]}, {"number": 2, "title": "Chūnin Exams", "episodes": [{"number": 1, "title": "The Chunin Exams Begin", "original": "TBC", "date": "TBC"}, {"number": 2, "title": "Rock Lee vs Sasuke", "original": "TBC", "date": "TBC"}, {"number": 3, "title": "Genin Takedown", "original": "TBC", "date": "TBC"}, {"number": 4, "title": "Start Your Engines", "original": "TBC", "date": "TBC"}, {"number": 5, "title": "The Tenth Question: All or Nothing!", "original": "TBC", "date": "TBC"}, {"number": 6, "title": "The Chunin Exam Stage 2: The Forest of Death", "original": "TBC", "date": "TBC"}, {"number": 7, "title": "Eat or Be Eaten: Panic in the Forest", "original": "TBC", "date": "TBC"}, {"number": 8, "title": "Introduction of Orochimaru", "original": "30", "date": "8 May 2003"}, {"number": 9, "title": "Bushy Brow's Pledge: Undying Love and Protection!", "original": "31", "date": "15 May 2003"}, {"number": 10, "title": "Sakura Blossoms!", "original": "32", "date": "22 May 2003"}, {"number": 11, "title": "Clone Counter Attack!", "original": "36", "date": "19 June 2003"}, {"number": 12, "title": "Surviving the Cut", "original": "37", "date": "26 June 2003"}, {"number": 13, "title": "Sasuke vs Yoro", "original": "39", "date": "10 July 2003"}, {"number": 14, "title": "Kakashi and Orochimaru: Face to Face", "original": "40", "date": "17 July 2003"}, {"number": 15, "title": "Kunoichi Rumble: The Rivals Get Serious!", "original": "41", "date": "24 July 2003"}, {"number": 16, "title": "Sakura vs Ino", "original": "42", "date": "31 July 2003"}, {"number": 17, "title": "Akamaru Unleashed! Who's Top Dog now?", "original": "44", "date": "14 August 2003"}, {"number": 18, "title": "Byakugan Battle: Hinata Grows Bold!", "original": "46", "date": "Release date pending"}, {"number": 19, "title": "Gaara vs. Rock Lee: The Power of Youth Explodes!", "original": "48", "date": "11 September 2003"}, {"number": 20, "title": "A Shadow in Darkness: Danger Approaches Sasuke", "original": "51", "date": "2 October 2003"}, {"number": 21, "title": "Ebisu Returns: Naruto's Toughest Training Yet!", "original": "52", "date": "9 October 2003"}, {"number": 22, "title": "Long Time No See: Jiraiya Returns", "original": "53", "date": "16 October 2003"}, {"number": 23, "title": "The Summoning Jutsu: Wisdom of the Pervy Sage!", "original": "54", "date": "23 October 2003"}, {"number": 24, "title": "Naruto Meets the Nine-Tails", "original": "TBC", "date": "TBC"}, {"number": 25, "title": "Gaara's Bloodlust", "original": "58", "date": "20 November 2003"}, {"number": 26, "title": "Byakugan vs Shadow Clone Technique", "original": "60", "date": "4 December 2003"}, {"number": 27, "title": "Ultimate Defense: Zero Blind Spot!", "original": "61", "date": "11 December 2003"}, {"number": 28, "title": "Shikamaru vs. Temari: The Battle of Wits", "original": "TBC", "date": "TBC"}, {"number": 29, "title": "Sasuke's Inner Strength", "original": "67", "date": "5 February 2004"}, {"number": 30, "title": "Sasuke's New Technique", "original": "TBC", "date": "TBC"}, {"number": 31, "title": "Orochimaru Threatens the Third Hokage", "original": "68", "date": "12 February 2004"}, {"number": 32, "title": "Tracking the Enemy", "original": "TBC", "date": "TBC"}, {"number": 33, "title": "Hiruzen's Past", "original": "TBC", "date": "TBC"}, {"number": 34, "title": "Forbidden Secret Technique: Reaper Death Seal!", "original": "73", "date": "18 March 2004"}, {"number": 35, "title": "Sasuke's Decision: Pushed To The Edge!", "original": "74–75", "date": "1 April 2004"}, {"number": 36, "title": "The Two Faces of Gaara: Light vs Darkness", "original": "76–77", "date": "15 April 2004"}, {"number": 37, "title": "Gaara Becomes the Sand Monster", "original": "78–79", "date": "29 April 2004"}, {"number": 38, "title": "Third Hokage Forever", "original": "80", "date": "6 May 2004"}]}]};const KEY="narucannon-progress-v3";let progress=JSON.parse(localStorage.getItem(KEY)||"{}");
const all=DATA.seasons.flatMap(s=>s.episodes.map(e=>({...e,season:s.number})));
function update(){let w=all.filter(e=>progress[`s${e.season}e${e.number}`]).length,p=Math.round(w/all.length*100);document.getElementById("watched").textContent=w;document.getElementById("percent").textContent=p+"%";document.getElementById("fill").style.width=p+"%"}
function render(){let q=document.getElementById("search").value.toLowerCase().trim(),sf=document.getElementById("season").value,root=document.getElementById("list");root.innerHTML="";
DATA.seasons.forEach(s=>{if(sf!=="all"&&sf!==String(s.number))return;let eps=s.episodes.filter(e=>`${e.title} ${e.original} ${e.number}`.toLowerCase().includes(q));if(!eps.length)return;
let sec=document.createElement("section");sec.className="season";let head=document.createElement("div");head.className="season-head";let h=document.createElement("h2");h.textContent=`Season ${s.number} — ${s.title}`;
let actions=document.createElement("div");actions.className="season-actions";let c=document.createElement("div");c.className="season-count";let count=s.episodes.filter(e=>progress[`s${s.number}e${e.number}`]).length;c.textContent=`${count}/${s.episodes.length} watched`;
let b=document.createElement("button");b.className="selectall";b.textContent=count===s.episodes.length?"Deselect All":"Select All";b.onclick=()=>{let select=count!==s.episodes.length;s.episodes.forEach(e=>{let k=`s${s.number}e${e.number}`;if(select)progress[k]=true;else delete progress[k]});localStorage.setItem(KEY,JSON.stringify(progress));render();update()};
actions.append(c,b);head.append(h,actions);sec.append(head);
eps.forEach(e=>{let k=`s${s.number}e${e.number}`,row=document.createElement("div");row.className="episode"+(progress[k]?" done":"");row.innerHTML=`<div class="num">E${String(e.number).padStart(2,"0")}</div><div><div class="title"></div><div class="meta"></div></div><button class="check">${progress[k]?"✓":""}</button>`;row.querySelector(".title").textContent=e.title;row.querySelector(".meta").textContent=`Original Naruto: ${e.original} · ${e.date}`;row.querySelector(".check").onclick=()=>{progress[k]=!progress[k];localStorage.setItem(KEY,JSON.stringify(progress));render();update()};sec.append(row)});root.append(sec)})}
document.getElementById("search").oninput=render;document.getElementById("season").onchange=render;document.getElementById("reset").onclick=()=>{if(confirm("Reset all NaruCannon progress?")){progress={};localStorage.setItem(KEY,JSON.stringify(progress));render();update()}};render();update();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script></body></html>
